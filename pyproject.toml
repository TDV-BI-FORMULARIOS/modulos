[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modulos-formularios"
version = "1.0.0"
description = "Modulos compartilhados dos formularios do B.I. da Della Volpe"
requires-python = ">=3.9"
dependencies = [
    "supabase",
    "pandas",
    "streamlit",
    "requests-oauthlib",
    "minio",
]

# Declarados um a um, de proposito. O pacote antigo usava find_packages() a
# partir da raiz, que nao enxerga os modulos da raiz - e por isso `Modulos`
# nunca chegou a existir depois do pip install.
[tool.setuptools]
packages = [
    "Modulos",
    "Modulos.Minio",
    "Modulos.Minio.examples",
    "Modulos.Minio.minio_client",
]
